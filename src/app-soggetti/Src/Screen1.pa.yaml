Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |+
        =ClearCollect(colSoggetti, SortByColumns('rm-soggetti', "createdon", SortOrder.Descending)); Set(varCurrentIndex, 1); Set(varIsNew, true); NewForm(Form1)
