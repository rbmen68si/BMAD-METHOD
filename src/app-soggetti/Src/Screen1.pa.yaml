              =If(varIsNew || CountRows(colSoggetti) = 0, Defaults('rm-soggetti'), Index(colSoggetti, varCurrentIndex))

            OnSuccess: |+
              =Refresh('rm-soggetti'); ClearCollect(colSoggetti, SortByColumns('rm-soggetti', "createdon", SortOrder.Descending)); Set(varCurrentIndex, 1); Set(varIsNew, false); EditForm(Form1)

